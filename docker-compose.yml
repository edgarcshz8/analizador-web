version: "3.8"

services:
  backend:
    build: ./backend
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      # PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
